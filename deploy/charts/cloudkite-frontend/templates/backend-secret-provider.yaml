{{- if .Values.backend.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudkite-database
  labels:
    {{- include "cloudkite-frontend.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.backend.cloudSql.credentialsSecretProject }}/secrets/{{ .Values.backend.cloudSql.credentialsSecretId }}/versions/latest"
        path: "database.json"
{{- end }}
