{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudkite-frontend.fullname" . }}-backend
  labels:
    {{- include "cloudkite-frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
  selector:
    {{- include "cloudkite-frontend.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
