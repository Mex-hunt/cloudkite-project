{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name | default (include "cloudkite-app.fullname" .) }}
  labels:
    {{- include "cloudkite-app.labels" . | nindent 4 }}
  {{- with .Values.certificate.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ .Values.certificate.secretName | quote }}
  dnsNames:
    {{- if .Values.certificate.dnsNames }}
    {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
    {{- else }}
    - {{ .Values.ingress.host | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name | quote }}
    kind: {{ .Values.certificate.issuerRef.kind | quote }}
    {{- with .Values.certificate.issuerRef.group }}
    group: {{ . | quote }}
    {{- end }}
{{- end }}
