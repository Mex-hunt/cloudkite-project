kube-prometheus-stack:
  fullnameOverride: cloudkite-monitoring

  crds:
    enabled: false

  defaultRules:
    create: true
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeScheduler: false

  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
        smtp_smarthost: smtp.gmail.com:587
        smtp_from: chimezieuzoma36@gmail.com
        smtp_auth_username: chimezieuzoma36@gmail.com
        smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
        smtp_require_tls: true
      route:
        group_by:
          - namespace
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: cloudkite-email
      receivers:
        - name: cloudkite-email
          email_configs:
            - to: chimezieuzoma36@gmail.com
              send_resolved: true
    alertmanagerSpec:
      secrets:
        - alertmanager-smtp
      replicas: 1
      retention: 120h
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  grafana:
    enabled: true
    defaultDashboardsEnabled: true
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    service:
      type: ClusterIP
    ingress:
      enabled: false
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi

  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 7d
      scrapeInterval: 30s
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1Gi

  kubeEtcd:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
