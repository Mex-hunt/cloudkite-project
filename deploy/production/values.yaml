cloudkite-app:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: http

  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP

  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  backend:
    enabled: false
    databaseCredentials:
      enabled: false
      secretProviderClassName: cloudkite-database
      secretProject: chimezie-interview-project
      secretId: cloudkite-database-credentials
      version: latest
      fileName: database.json
      mountPath: /var/secrets
      envName: DATABASE_CREDENTIALS_FILE
    cloudSqlProxy:
      enabled: false
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
      connectionName: chimezie-interview-project:us-central1:cloudkite-postgres
      privateIp: true
      structuredLogs: true
      port: 5432
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
