name: APPLICATION-PIPELINE

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  frontend-image-build:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    needs:
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f app/frontend/Dockerfile -t cloudkite-auth-frontend:${{ github.sha }} app/frontend

  frontend-image-publish:
    name: Push frontend Docker image
    runs-on: ubuntu-latest
    needs:
      - frontend-image-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set frontend image name
        run: |
          REPOSITORY="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "FRONTEND_IMAGE=ghcr.io/${REPOSITORY}/auth-frontend" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build -f app/frontend/Dockerfile -t "${FRONTEND_IMAGE}:${{ github.sha }}" app/frontend
          docker push "${FRONTEND_IMAGE}:${{ github.sha }}"

  deploy:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs:
      - frontend-image-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy frontend from main only
        run: echo "Deploy placeholder deploy frontend image tagged ${{ github.sha }}."
