substitutions:
  _DOCKERHUB_NAMESPACE: obachimex
  _APP_VERSION: ${SHORT_SHA}
  _REGION: us-central1
  _VITE_API_BASE_URL: https://chimex.duckdns.org
  _VITE_ENVIRONMENT: production
  _DEPLOY: "false"
  _GITOPS_BRANCH: main

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/cloudkite-cloud-build@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  - id: build-frontend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg
      - VITE_APP_VERSION=${_APP_VERSION}
      - --build-arg
      - VITE_ENVIRONMENT=${_VITE_ENVIRONMENT}
      - -t
      - ${_DOCKERHUB_NAMESPACE}/cloudkite-frontend:${_APP_VERSION}
      - app/frontend

  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/backend/Dockerfile
      - -t
      - ${_DOCKERHUB_NAMESPACE}/cloudkite-backend:${_APP_VERSION}
      - .

  - id: dockerhub-login
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - DOCKERHUB_USERNAME
      - DOCKERHUB_TOKEN
    args:
      - -c
      - |
        echo "$$DOCKERHUB_TOKEN" | docker login \
          --username "$$DOCKERHUB_USERNAME" \
          --password-stdin

  - id: push-dockerhub-images
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        docker push "${_DOCKERHUB_NAMESPACE}/cloudkite-frontend:${_APP_VERSION}"
        docker push "${_DOCKERHUB_NAMESPACE}/cloudkite-backend:${_APP_VERSION}"

  - id: promote-gitops-values
    name: alpine:3.20
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ "${_DEPLOY}" != "true" ] || [ "${BRANCH_NAME}" != "main" ]; then
          echo "GitOps promotion skipped"
          exit 0
        fi

        apk add --no-cache bash git

        APP_VERSION="${_APP_VERSION}" \
          DOCKERHUB_NAMESPACE="${_DOCKERHUB_NAMESPACE}" \
          bash scripts/promote-gitops-images.sh

        if git diff --quiet -- \
          deploy/production/values/cloudkite/frontend.yaml \
          deploy/production/values/cloudkite/backend.yaml; then
          echo "No GitOps values changes to promote"
          exit 0
        fi

        git config user.email "cloud-build@${PROJECT_ID}.iam.gserviceaccount.com"
        git config user.name "cloud-build"
        git add \
          deploy/production/values/cloudkite/frontend.yaml \
          deploy/production/values/cloudkite/backend.yaml
        git commit -m "chore(gitops): promote images ${_APP_VERSION}"
        git push origin "HEAD:${_GITOPS_BRANCH}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DOCKERHUB_USERNAME/versions/latest
      env: DOCKERHUB_USERNAME
    - versionName: projects/${PROJECT_ID}/secrets/DOCKERHUB_TOKEN/versions/latest
      env: DOCKERHUB_TOKEN
