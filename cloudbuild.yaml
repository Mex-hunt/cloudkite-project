substitutions:
  _DOCKERHUB_NAMESPACE: obachimex
  _DOCKERHUB_USERNAME: obachimex
  _APP_VERSION: ${SHORT_SHA}
  _REGION: us-central1
  _VITE_API_BASE_URL: http://localhost:8000
  _VITE_ENVIRONMENT: production
  _DEPLOY: "false"
  _CLUSTER_NAME: cloudkite-gke
  _NAMESPACE: cloudkite
  _APP_HOST: auth.example.com
  _STATIC_IP_NAME: cloudkite-ingress-ip
  _CERTIFICATE_NAME: cloudkite-certificate
  _BACKEND_GSA: cloudkite-backend@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_SQL_CONNECTION: ${PROJECT_ID}:us-central1:cloudkite-postgres
  _DATABASE_SECRET_ID: cloudkite-database-credentials
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DOCKERHUB_TOKEN/versions/latest
      env: DOCKERHUB_TOKEN
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: build-frontend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg
      - VITE_APP_VERSION=${_APP_VERSION}
      - --build-arg
      - VITE_ENVIRONMENT=${_VITE_ENVIRONMENT}
      - -t
      - ${_DOCKERHUB_NAMESPACE}/cloudkite-frontend:${_APP_VERSION}
      - app/frontend

  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - app/backend/Dockerfile
      - -t
      - ${_DOCKERHUB_NAMESPACE}/cloudkite-backend:${_APP_VERSION}
      - .

  - id: dockerhub-login
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - DOCKERHUB_TOKEN
    args:
      - -c
      - |
        echo "$$DOCKERHUB_TOKEN" | docker login \
          --username "${_DOCKERHUB_USERNAME}" \
          --password-stdin

  - id: push-dockerhub-images
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        docker push "${_DOCKERHUB_NAMESPACE}/cloudkite-frontend:${_APP_VERSION}"
        docker push "${_DOCKERHUB_NAMESPACE}/cloudkite-backend:${_APP_VERSION}"

  - id: get-gke-credentials
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY}" != "true" || "${BRANCH_NAME}" != "main" ]]; then
          echo "Deployment skipped for branch ${BRANCH_NAME}"
          exit 0
        fi
        gcloud container clusters get-credentials "${_CLUSTER_NAME}" \
          --region "${_REGION}" \
          --project "${PROJECT_ID}"

  - id: deploy
    name: alpine/helm:3.16.4
    entrypoint: sh
    args:
      - -ceu
      - |
        if [ "${_DEPLOY}" != "true" ] || [ "${BRANCH_NAME}" != "main" ]; then
          echo "Deployment skipped"
          exit 0
        fi
        helm upgrade --install cloudkite deploy/charts/cloudkite-frontend \
          --namespace "${_NAMESPACE}" \
          --create-namespace \
          --atomic \
          --timeout 10m \
          --set-string image.repository="${_DOCKERHUB_NAMESPACE}/cloudkite-frontend" \
          --set-string image.tag="${_APP_VERSION}" \
          --set-string backend.image.repository="${_DOCKERHUB_NAMESPACE}/cloudkite-backend" \
          --set-string backend.image.tag="${_APP_VERSION}" \
          --set-string backend.googleServiceAccount="${_BACKEND_GSA}" \
          --set-string backend.cloudSql.connectionName="${_CLOUD_SQL_CONNECTION}" \
          --set-string backend.cloudSql.credentialsSecretProject="${PROJECT_ID}" \
          --set-string backend.cloudSql.credentialsSecretId="${_DATABASE_SECRET_ID}" \
          --set ingress.enabled=true \
          --set-string ingress.host="${_APP_HOST}" \
          --set-string ingress.staticIpName="${_STATIC_IP_NAME}" \
          --set-string ingress.managedCertificateName="${_CERTIFICATE_NAME}"
